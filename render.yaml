services:
  - type: web
    name: django-ecommerce-store
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python -m gunicorn ecommerce.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: ALLOWED_HOSTS
        value: '*'
